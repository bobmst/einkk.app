name: "Wrong number or data / 数据有误 / データの誤り"
description: "A forecast, border or other number on the site looks wrong."
labels: ["data", "needs-triage", "source:player"]
body:
  - type: markdown
    attributes:
      value: |
        Numbers are enough. Please don't post screenshots, your in-game name or your union name. Issues are public.
        写数字就够了。请不要贴截图，也不要写游戏内名称或联盟名称：issue 是公开的。
        数字だけで十分です。issue は公開されるため、スクリーンショットやゲーム内の名前、ユニオン名は載せないでください。
  - type: dropdown
    id: server
    attributes:
      label: "Server / 服务器 / サーバー"
      options: ["JP", "KR", "NA", "SEA", "TW-HK", "Global"]
    validations:
      required: true
  - type: input
    id: season
    attributes:
      label: "Solo Raid season (number) / 赛季编号 / シーズン番号"
  - type: textarea
    id: what
    attributes:
      label: "What is wrong, and what should it be? / 哪里不对，应该是多少？ / どこが違い、正しくはいくつですか？"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "How do you know? (what you saw in game, or a link) / 你是怎么知道的？（游戏里看到的数字或链接） / 根拠（ゲーム内で見た数字やリンク）"
